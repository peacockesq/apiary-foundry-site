name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_DEPLOY_KEY }}
          log-public-key: false

      - name: Deploy via rsync + compose
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              root@37.27.49.209 \
              "mkdir -p /opt/apiary-foundry-site && cd /opt/apiary-foundry-site && docker compose down || true"
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null" \
            ./ root@37.27.49.209:/opt/apiary-foundry-site/
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/dev/null \
              root@37.27.49.209 \
              "cd /opt/apiary-foundry-site && docker compose up --build -d"
